[project]
name = "hcmil-astrocyte-braak"
version = "0.1.0"
description = "Research code for hierarchical cell-scale multiple-instance learning and astrocyte gene attribution"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Yaxuan Cui"}, {name = "Jingwen Yan"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "pyyaml>=6,<7",
  "tabulate>=0.9,<1",
  "matplotlib>=3.8,<4",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
analysis = [
  "anndata>=0.10,<0.13",
  "scanpy>=1.10,<2",
  "scvi-tools>=1.2,<2",
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
target-version = "py311"
